seed: 17
bin_size_s: 0.02
delay_bins: 60
response_bins: 75
max_units_per_region: 128
regions:
  - left ALM
  - right ALM
  - left Striatum
  - right Striatum
region_aliases:
  left alm: left ALM
  alm-left: left ALM
  leftalm: left ALM
  right alm: right ALM
  alm-right: right ALM
  rightalm: right ALM
  left striatum: left Striatum
  left str: left Striatum
  str-left: left Striatum
  right striatum: right Striatum
  right str: right Striatum
  str-right: right Striatum
model:
  hidden_dim: 48
  tcn_layers: 4
  kernel_size: 3
  dropout: 0.15
  attention_heads: 4
training:
  batch_size: 16
  epochs: 60
  learning_rate: 0.0005
  weight_decay: 0.0001
  classification_weight: 1.0
  forecast_weight: 0.35
  sparsity_weight: 0.005
  temporal_tv_weight: 0.001
  patience: 10
  folds: 5
  num_workers: 0
selection:
  top_fraction: 0.15
  min_units_per_region: 3
  stability_bootstraps: 100
  stability_threshold: 0.70
