[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delaycast"
version = "0.1.0"
description = "DelayCAST: delay-epoch causal attention + spectro-temporal neuron selection for ALM/striatum lick decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "PyWavelets>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "torch>=2.1",
]

[project.scripts]
delaycast = "delaycast.cli:main"

[tool.setuptools.packages.find]
include = ["delaycast*"]
