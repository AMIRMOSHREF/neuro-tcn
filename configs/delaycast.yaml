# DelayCAST default configuration.
# Every value can be overridden on the command line, e.g.
#   python -m delaycast train --set train.epochs=40 --set data.data_a_root=D:/Rodent/Data

data:
  # Dataset A: <root>/Session*/Rasters/{Ignore,Left,Right}/trial_*.npz (+ Videos/...)
  data_a_root: "C:/PythonProject/Rodent/Data"
  # Dataset B: <root>/sub-*/sub-*_ses-*/NPZ/{Ignore,Left,Right}/trial*.npz (+ behavioral_master_log_audited.csv)
  data_b_root: "C:/PythonProject/Rodent/Data2"
  use_dataset_a: true
  use_dataset_b: true
  cache_dir: "cache"         # binned per-session tensors are stored here (safe to delete)
  drop_duplicate_sessions: true   # a session present in both Data and Data2 (same recording) is used once
  duplicate_keep: B          # which copy of a duplicated recording is kept: B (Data2, audited log) | A (Data)
  min_trials_per_session: 30 # sessions with fewer trials after QC are excluded from every command (a loading problem, not a small recording)
  min_trials_per_lick_class: 5   # ... and sessions with fewer Left or Right trials
  bin_ms: 10                 # raster bin width used for the model input (delay/context)
  target_bin_ms: 50          # bin width for the response-epoch forecasting target
  context:
    include_sample: false    # if true the context window starts at sample onset instead of delay onset
    pre_delay_ms: 0          # extra context before delay onset (only used when include_sample is false)
    delay_ms: 1200           # nominal delay length (all trials in the audited log have exactly 1.2 s)
  target:
    response_ms: 1500        # response (go / lick) epoch length after go cue
  smoothing_sigma_ms: 20     # Gaussian kernel used to turn spike counts into rates for spectral features
  qc:
    drop_early_lick: true          # licks before go cue -> drop trial (both datasets, from NPZ lick times)
    drop_label_mismatch: true      # folder label disagrees with lick times in NPZ / CSV -> drop trial
    require_csv_row: false         # Dataset B: drop trial if no matching audited CSV row
    csv_exclude_photostim: true
    csv_exclude_auto_water: true
    csv_keep_outcomes: [hit, miss, ignore]   # Data2 log outcomes kept; the class is the OBSERVED lick side, so error
                                             # ("miss") trials are kept by default (set to [hit, ignore] for instruction-only)
    max_delay_dev_ms: 15           # drop a trial whose delay length deviates more than this from context.delay_ms
                                   # (the audited logs guarantee 1.2 s; anything else is an epoch-extraction error;
                                   # 15 ms tolerates float epoch rounding, i.e. at most a +-1..2 bin length fix)
    min_trials_per_class: 3        # sessions with fewer trials in a class are still used but flagged

selection:
  min_rate_hz: 1.0            # activity floor on delay-epoch mean rate
  min_active_trial_frac: 0.2  # unit must spike in at least this fraction of trials (delay epoch)
  fdr_q: 0.05                 # Benjamini-Hochberg threshold for every statistical criterion
  late_delay_ms: 400          # window (end of delay) used for the delay->response coupling criterion
  wavelet: "cmor1.5-1.0"      # complex Morlet for CWT
  bands_hz:                   # bands used for the spectro-temporal criterion and the STFT branch
    slow: [1, 4]
    theta: [4, 12]
    beta: [12, 30]
  window_ms: 200              # temporal-locus (T): sliding-window length ...
  window_step_ms: 50          # ... and step (200/50 -> 21 windows over a 1.2 s delay)
  locus_threshold: 0.1        # |AUROC - 0.5| above which a window belongs to a cluster
  locus_n_perm: 200           # label permutations (shared across units) for the cluster-mass null
  coupling_n_perm: 500        # circular-shift permutations for the coupling (C) null on the full fit set ...
  subsample_n_perm: 100       # ... and inside each stability subsample
  min_ignore_trials: 8        # the descriptive Ignore-vs-lick test needs at least this many Ignore trials
  n_freqs_per_band: 5         # CWT scales per band (the W statistic averages over them)
  min_cwt_freq_hz: 2          # lowest wavelet frequency (a Morlet below ~2 Hz spans more than the 1.2 s delay)
  spectral_candidates: all    # which units get the CWT: all (default, no dependence on trial subsets) | floor | screened
  cwt_units_per_block: 128    # units per CWT block (bounds transient memory: n_trials x block x T floats)
  weights:                    # weights of the -log10(q) terms in the score (tie-breaker after stability)
    selectivity: 1.0
    coupling: 1.0
    spectral: 0.75
    ramp: 0.5
  min_criteria: 2             # unit must satisfy at least this many of S, C, W, R to be eligible
  n_subsamples: 50            # stability selection: stratified half-subsamples of the fit trials (0 = off)
  subsample_frac: 0.5         # fraction of trials per subsample (without replacement)
  min_stability: 0.6          # selection frequency needed to count as "stable" (> 0.5 for the false-selection bound)
  fill_unstable: false        # if fewer than K stable units: keep K_eff < K (false) or fill by score (true)
  n_null_permutations: 2      # `select` only: label-permuted repeats giving the chance level of stability
  fit_on_train_only: true     # during `train`, criteria are computed on the training(+validation) trials only
  holdout_mode: label_free    # held-out sessions (cross_session / cross_dataset): label_free | adapt
  min_criteria_label_free: 1  # label-free eligibility: >= this many of {C, R}
  top_k_per_region: 32        # K selected neurons per region per session (padded with zeros if fewer)

model:
  d_model: 64
  tcn_blocks: 5               # dilations 1,2,4,...,2^(blocks-1); kernel 3 -> receptive field 125 bins @10 ms (~ whole delay)
  kernel_size: 3
  dropout: 0.15
  n_heads: 4
  n_transformer_layers: 2     # causal Transformer blocks after the TCN (pre-norm MHA + FFN, causal mask)
  positional_encoding: sinusoidal  # fixed time-to-go encoding added before the Transformer: sinusoidal | learned | none
  spectral_branch: bands      # in-model causal Gabor filterbank on the gated population: bands | popmean (matched control) | none
  spectral_win_ms: 300        # window of the causal filterbank (past bins only)
  neuron_gate_penalty: hoyer  # scale-invariant Hoyer sparsity (hoyer) or plain L1 mass (l1)
  neuron_gate_weight: 0.5     # weight of the gate sparsity penalty (mean over regions)
  forecast_weight: 1.0        # weight of the Poisson forecasting loss
  persistence_late_bins: 20   # late-delay window (bins) whose mean rate seeds each neuron's own forecast
  class_weight: 1.0

train:
  seed: 0                       # seed of a single run; `train --seeds 0,1,2` repeats every run per seed
  seeds: [0, 1, 2]              # default seed list used by `train` / `all` (splits differ per seed, shared across modes)
  epochs: 60
  batch_size: 32
  lr: 0.002
  gate_lr_mult: 10.0            # neuron gates learn faster than the backbone
  weight_decay: 0.0001
  patience: 12
  select_by: "val_loss"         # checkpoint selection: val_loss (multi-task) | val_bacc (classification only)
  eval_mode: "within_session"   # within_session | cross_session | cross_dataset
  split_scheme: "random"        # random (stratified) | blocked (contiguous test blocks + guard gap; drift-robust)
  val_frac: 0.15
  test_frac: 0.15
  class_weight_cap: 5.0         # inverse-frequency class weights are capped here (Ignore is rare)
  adapt_frac: 0.3               # cross_*: fraction of held-out trials used to fit the session adapter (+ select units)
  adapt_val_frac: 0.2           # part of the adapt trials kept for early stopping of the adapter fit
  adapt_epochs: 15
  adapt_fit_gates: false        # keep the held-out session's gates at their init during adaptation
  context_aug_prob: 0.5         # probability that a training batch sees only the last `keep` ms of the delay
  context_aug_min_ms: 100       # shortest context kept by the augmentation
  window_dropout_prob: 0.2      # probability that one random window of the delay is masked (in-distribution occlusion)
  window_dropout_ms: 200
  region_dropout_prob: 0.2      # probability that one region's input is removed for a batch (in-distribution ablation)
  num_workers: 0
  device: "auto"

evaluate:
  context_sweep_ms: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200]
  n_shuffles: 1000              # within-session label permutations for the chance level (predictions fixed)
  n_bootstrap: 1000             # trial resamples (stratified by session x class) for CIs and the CSI
  occlusion: permute            # permute (slice replaced by another test trial of the same session) | zero
  occlusion_window_ms: 200      # window length of the temporal occlusion map
  occlusion_step_ms: 100
  csi_fraction: 0.95            # tau95 = shortest context keeping >= 95 % of full-context accuracy (isotonic fit)
  linear_sweep: true            # model-free tau95 from a tuned linear decoder on all units (last tau ms only)
  neuron_importance: true       # per-neuron permutation-occlusion importance (one batched forward per region)

figures:
  dpi: 300                     # publication resolution (Figure 1 is a 2000-row raster)
  raster_trial: null           # path to a specific NPZ to plot; default = first Left trial of first session
  raster_row_order: status     # Figure 1 row order inside each region: status (selected first) | recording

output_dir: "outputs/delaycast"
